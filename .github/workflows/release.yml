name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31

      - name: Check tag matches CMake version
        run: grep -q "project(hudname VERSION ${GITHUB_REF_NAME#v} " CMakeLists.txt

      - name: Build
        run: nix build -L

      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          cp result/hudname.asi result/hudname.ini result/MinHook-LICENSE.txt README.md LICENSE dist/
          cd dist
          python3 -m zipfile -c "hudname-${VERSION}.zip" \
            hudname.asi hudname.ini README.md LICENSE MinHook-LICENSE.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.zip
